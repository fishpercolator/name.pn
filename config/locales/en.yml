  pronoun_examples:
    cooking:
      name_html: '<b>%{pronoun}</b> is a great cook.'
      nominative_html: '<b>%{pronoun_initial}</b> %{copula} really good at cooking.'
      oblique_html: 'Cooking comes really naturally to <b>%{pronoun}</b>.'
      possessive_determiner_html: 'Cooking is one of <b>%{pronoun}</b> best skills.'
      possessive_html: 'I think this cookbook is <b>%{pronoun}</b>.'
      reflexive_html: '%{nominative_initial} %{copula} cooking this recipe for <b>%{pronoun}</b>.'
    dancing:
      name_html: '<b>%{pronoun}</b> is often found on the dance floor.'
      nominative_html: '<b>%{pronoun_initial}</b> %{copula} dancing right now.'
      oblique_html: 'You should see <b>%{pronoun}</b> dance!'
      possessive_determiner_html: 'Dancing is one of <b>%{pronoun}</b> passions.'
      possessive_html: 'The dance trophy should have been <b>%{pronoun}</b>!'
      reflexive_html: '%{nominative_initial} %{copula} keeping <b>%{pronoun}</b> fit by dancing.'
    reading:
      name_html: '<b>%{pronoun}</b> is a book-lover.'
      nominative_html: '<b>%{pronoun_initial}</b> %{copula} about to finish reading a book.'
      oblique_html: 'Books are a good gift for <b>%{pronoun}</b>.'
      possessive_determiner_html: 'That is <b>%{pronoun}</b> third book this month!'
      possessive_html: 'Your book collection is smaller than <b>%{pronoun}</b>.'
      reflexive_html: '%{nominative_initial} %{copula} taking some time for <b>%{pronoun}</b> to read.'
    running:
      name_html: '<b>%{pronoun}</b> likes to run.'
      nominative_html: '<b>%{pronoun_initial}</b> %{copula} running a half-marathon.'
      oblique_html: 'I saw <b>%{pronoun}</b> running just yesterday.'
      possessive_determiner_html: 'Today %{nominative} %{copula} trying to beat <b>%{pronoun}</b> personal best.'
      possessive_html: 'These running shoes are <b>%{pronoun}</b>.'
      reflexive_html: '%{nominative_initial} %{copula} only competing against <b>%{pronoun}</b>.'
    boardgaming:
      name_html: '<b>%{pronoun}</b> plays board games.'
      nominative_html: '<b>%{pronoun_initial}</b> %{copula} a bit competitive.'
      oblique_html: 'Maybe you will win a game against <b>%{pronoun}</b> one day.'
      possessive_determiner_html: '<b>%{pronoun_initial}</b> board game collection is impressive.'
      possessive_html: 'Your collection is a lot smaller than <b>%{pronoun}</b>.'
      reflexive_html: '%{personal_name} keeps a journal to remind <b>%{pronoun}</b> of past gaming victories.'
    tv:
      name_html: '<b>%{pronoun}</b> is watching TV.'
      nominative_html: '<b>%{pronoun_initial}</b> %{copula} about to watch another episode.'
      oblique_html: 'According to <b>%{pronoun}</b>, this is the best show on TV.'
      possessive_determiner_html: 'Well, definitely in <b>%{pronoun}</b> all-time top ten.'
      possessive_html: 'I wanted to watch something else, but the TV set is <b>%{pronoun}</b>.'
      reflexive_html: '%{personal_name} sees <b>%{pronoun}</b> in the lead character.'
