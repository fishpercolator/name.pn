name: audits
run-name: ${{ github.actor }} is running dependency audits
on: [push]
permissions:
  contents: read
jobs:
  ruby:
    name: Ruby (bundle audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run bundle audit
        run: bin/bundler-audit check --update
  brakeman:
    name: Ruby (brakeman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run brakeman
        run: bin/brakeman --no-pager
  js:
    name: JS (bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install bun dependencies
        run: bun install --frozen-lockfile
      # deepmerge's prototype-poisoning advisory has no fixed release. It's only installed as a
      # dependency of a rollup plugin (via ActiveAdmin's flowbite-datepicker), and nothing here runs
      # rollup. Drop the ignore once a fixed deepmerge is released.
      - name: Run bun audit
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4
